networks:
  eva-01:
    driver: bridge

# Volumes with the data of the client come from SOULWORKER_DATAS, the `datas` folder of an
# installed client: set it in the shell or in `.env` next to this file, e.g.
# SOULWORKER_DATAS=/mnt/games/soulworker/datas
# Servers also read ConnectionStrings__Postgres, ConnectionStrings__Redis and Server__Port;
# the defaults match the services above. Hotspot__PacketDumpPath= (empty) turns the dumps off.

# https://youtu.be/Soa3gO7tL-c?list=RDMM
