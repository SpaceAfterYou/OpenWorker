networks:
  eva-01:
    driver: bridge

# Volumes with the data of the client come from SOULWORKER_DATAS, the `datas` folder of an
# installed client: set it in the shell or in `.env` next to this file, e.g.
# SOULWORKER_DATAS=/mnt/games/soulworker/datas
# Every server ships its defaults in appsettings.json, and they match the services above: the Postgres and
# Redis containers (ConnectionStrings__Postgres, ConnectionStrings__Redis), the port inside the container
# (Server__Port) and the addresses clients are sent to (Auth__Host, Gate__Host, Maze__Host, Instance__PublicHost,
# all 127.0.0.1 for a local client). An environment variable named like the setting, with __ for :, replaces
# one. A district has no default for the port clients reach it at: Instance__PublicPort is the port it is
# published on, as in the ports above. A server stops at start, naming the setting, when one is missing or wrong.
# Hotspot__PacketDumpPath= (empty) turns the dumps off.

# https://youtu.be/Soa3gO7tL-c?list=RDMM
# https://youtu.be/_N66Hud_Tq4?list=RDeT2XZA8LZzM

