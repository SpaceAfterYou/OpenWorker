# What every OpenWorker server container shares: how compose tells that it can take players. The health endpoint
# (Health__Port, 8080 inside the container) is not published: compose probes it from inside, and from the host
# `docker compose exec <service> curl -s http://127.0.0.1:8080/readyz` shows which check fails.
# /readyz is the probe: it fails while Redis or the database does not answer, and while the server drains for a stop,
# so `docker compose ps` shows what a client would meet. The first minute is the migration and loading the tables.
x-openworker-server: &openworker-server
  healthcheck:
    test: [ "CMD-SHELL", "curl --fail --silent --show-error --max-time 4 http://127.0.0.1:$${Health__Port:-8080}/readyz > /dev/null" ]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 60s

services:
  redis:
    container_name: "OpenWorker-Redis"
    image: redis/redis-stack:latest
    pull_policy: missing
    restart: on-failure
    ports:
      - "6379:6379"
      - "5540:8001"
    networks:
      - eva-01
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5

  rabbitmq:
    container_name: "OpenWorker-RabbitMQ"
    image: rabbitmq:management-alpine
    pull_policy: missing
    restart: on-failure
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - eva-01
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 10s
      retries: 5

  postgres:
    container_name: "OpenWorker-Postgres"
    image: postgres:alpine
    pull_policy: missing
    restart: on-failure
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
    ports:
      - "5432:5432"
    networks:
      - eva-01
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]

  pgadmin:
    container_name: "OpenWorker-PgAdmin"
    image: dpage/pgadmin4:latest
    pull_policy: missing
    restart: on-failure
    environment:
      PGADMIN_DEFAULT_EMAIL: "root@postgresql.org"
      PGADMIN_DEFAULT_PASSWORD: "root"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    networks:
      - eva-01

  openworker.relayserver:
    <<: *openworker-server
    container_name: "OpenWorker-RelayServer"
    build:
      args:
        - BUILD_CONFIGURATION=Debug
      context: .
      dockerfile: OpenWorker.RelayServer/Dockerfile
    environment:
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft=Warning
      - Logging__LogLevel__System=Warning
      - Logging__LogLevel__Microsoft.Hosting.Lifetime=Warning
      - Credentials__DiscordToken=
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "10003:10000"
    networks:
      - eva-01
    volumes:
      - ${SOULWORKER_DATAS:-T:/Games/HanPurple/soulworker/datas}/bin/Table:/app/res

  openworker.authserver:
    <<: *openworker-server
    container_name: "OpenWorker-AuthServer"
