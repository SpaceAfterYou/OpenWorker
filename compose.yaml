# What every OpenWorker server container shares: how compose tells that it can take players, and how long it is given
# to stop. The health endpoint (Health__Port, 8080 inside the container) is not published: compose probes it from
# inside, and from the host `docker compose exec <service> curl -s http://127.0.0.1:8080/readyz` shows which check fails.
# /readyz is the probe: it fails while Redis or the database does not answer, and while the server drains for a stop,
# so `docker compose ps` shows what a client would meet. The first minute is the migration and loading the tables.
# stop_grace_period is longer than Shutdown__Timeout (30 s) so the server finishes its drain before docker kills it.
x-openworker-server: &openworker-server
  healthcheck:
    test: [ "CMD-SHELL", "curl --fail --silent --show-error --max-time 4 http://127.0.0.1:$${Health__Port:-8080}/readyz > /dev/null" ]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 60s
  stop_grace_period: 40s

services:
  redis:
    container_name: "OpenWorker-Redis"
    image: redis/redis-stack:latest
    pull_policy: missing
    restart: on-failure
    ports:
      - "6379:6379"
      - "5540:8001"
    networks:
      - eva-01
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5

  rabbitmq:
    container_name: "OpenWorker-RabbitMQ"
    image: rabbitmq:management-alpine
    pull_policy: missing
    restart: on-failure
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - eva-01
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # Each server keeps a small pool (Maximum Pool Size in its ConnectionStrings__Postgres: 16 for a gate, a district or a
  # maze, 8 for auth, 4 for the relay and the content loader), since one world loop cannot use more: with four districts
  # that is at most 112 connections. The default of 100 was too few when hundreds of players left at once (REFACTORING.md
  # 2.9.5); 200 leaves room for a second maze server, psql and pgAdmin.
  postgres:
    container_name: "OpenWorker-Postgres"
    image: postgres:alpine
    pull_policy: missing
    restart: on-failure
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
    ports:
      - "5432:5432"
    networks:
      - eva-01
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]

  pgadmin:
    container_name: "OpenWorker-PgAdmin"
    image: dpage/pgadmin4:latest
    pull_policy: missing
    restart: on-failure
    environment:
      PGADMIN_DEFAULT_EMAIL: "root@postgresql.org"
      PGADMIN_DEFAULT_PASSWORD: "root"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    networks:
      - eva-01

  # Metrics. The servers push them to Prometheus over OTLP (Telemetry__Endpoint, by default
  # http://prometheus:9090/api/v1/otlp/v1/metrics), Grafana reads them from it. See the notes at the end of the file.
  prometheus:
    container_name: "OpenWorker-Prometheus"
    image: prom/prometheus:v3.15.1
    pull_policy: missing
    restart: on-failure
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    networks:
      - eva-01
    volumes:
      - ./eng/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:9090/-/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    container_name: "OpenWorker-Grafana"
    image: grafana/grafana:12.4.14
    pull_policy: missing
    restart: on-failure
    environment:
      # Local development only: everybody who reaches the port is an administrator, there is no login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/openworker.json"
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - eva-01
    volumes:
      - ./eng/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./eng/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  openworker.relayserver:
    <<: *openworker-server
    container_name: "OpenWorker-RelayServer"
    build:
      args:
        - BUILD_CONFIGURATION=Debug
      context: .
      dockerfile: OpenWorker.RelayServer/Dockerfile
    environment:
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft=Warning
      - Logging__LogLevel__System=Warning
      - Logging__LogLevel__Microsoft.Hosting.Lifetime=Warning
      - Credentials__DiscordToken=${DISCORD_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "10003:10000"
    networks:
      - eva-01
    volumes:
      - ${SOULWORKER_DATAS:-T:/Games/HanPurple/soulworker/datas}/bin/Table:/app/res

  openworker.authserver:
    <<: *openworker-server
    container_name: "OpenWorker-AuthServer"
