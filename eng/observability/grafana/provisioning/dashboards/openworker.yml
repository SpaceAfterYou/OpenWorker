apiVersion: 1

providers:
  - name: OpenWorker
    folder: OpenWorker
    type: file
    # The dashboard is the file in eng/observability/grafana/dashboards: change it there, not in the browser.
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
