# Settings for a load test, laid over compose.yaml by eng/loadtest.sh and by nobody else:
#
#   docker compose -f compose.yaml -f eng/loadtest/compose.loadtest.yaml up -d --build
#
# compose.yaml stays what it is for development. This file only makes the servers fit to be measured:
#
#   * Release builds. The Debug build saves every packet it receives to a file under a lock (Hotspot:PacketDumpPath) and
#     logs a line for each packet that is not a move.
#   * Logs at Warning, so the console of the container is not the thing that is measured.
#   * No packet dumps.
#   * Twenty channels in a district instead of ten. A channel holds 65 players (it is Full above 64), so a thousand bots
#     in one district need at least sixteen. Set LOADTEST_CHANNELS to change it.
#
# The bots sign in with accounts they find in the database (OpenWorker.LoadTest seed creates them). Nothing here turns on
# Auth__AllowNextHumanNetworkLogin: that login signs everybody in as the first account of the database, which cannot
# carry more than one bot, and the production settings stay as they are.

x-server: &server
  build:
    args:
      - BUILD_CONFIGURATION=Release
  environment:
    - Logging__LogLevel__Default=Warning
    - Hotspot__PacketDumpPath=

services:
  # The relay creates the Redis indexes the other servers search by, so it has to run, and it will not start without a
  # token. It talks to Discord only if the token is real; a placeholder lets it make the indexes. It runs once: every
  # start of it drops the cache, which would take the sessions of the bots with it.
  openworker.relayserver:
    <<: *server
    restart: "no"
    environment:
      - Logging__LogLevel__Default=Warning
      - Credentials__DiscordToken=${LOADTEST_DISCORD_TOKEN:-loadtest-placeholder}

  openworker.authserver:
    <<: *server

  openworker.gateserver:
    <<: *server

  openworker.mazeserver:
    <<: *server

  openworker.districtserver-roccotown:
    build:
      args:
        - BUILD_CONFIGURATION=Release
    environment:
      - Logging__LogLevel__Default=Warning
      - Hotspot__PacketDumpPath=
      - Channel__To=${LOADTEST_CHANNELS:-20}

  openworker.districtserver-canduscity:
    build:
      args:
        - BUILD_CONFIGURATION=Release
    environment:
      - Logging__LogLevel__Default=Warning
      - Hotspot__PacketDumpPath=
      - Channel__To=${LOADTEST_CHANNELS:-20}

  openworker.districtserver-gracecity:
    build:
      args:
        - BUILD_CONFIGURATION=Release
    environment:
      - Logging__LogLevel__Default=Warning
      - Hotspot__PacketDumpPath=
      - Channel__To=${LOADTEST_CHANNELS:-20}

  openworker.districtserver-ruinfortress:
    build:
      args:
        - BUILD_CONFIGURATION=Release
    environment:
      - Logging__LogLevel__Default=Warning
      - Hotspot__PacketDumpPath=
      - Channel__To=${LOADTEST_CHANNELS:-20}

  openworker.updatecontent:
    build:
      args:
        - BUILD_CONFIGURATION=Release
    environment:
      - Logging__LogLevel__Default=Warning
